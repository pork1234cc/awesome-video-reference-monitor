[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "articlemonitor"
version = "0.1.0"
description = "独立的抖音与微信视频号对标账号登记和素材监控工具"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
article-monitor = "article_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
